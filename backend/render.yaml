services:
  - type: web
    name: typingtutor-backend
    env: python
    region: singapore
    plan: free

    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: ALLOWED_ORIGINS
        value: "https://typingpractice-alpha.vercel.app"

      - key: SECRET_KEY
        generateValue: true